name: Run notebooks

# Executes both demo notebooks from top to bottom. The run fails if any cell raises an error.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  execute:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        notebook:
          - W01_UncertaintyDemo_Team01_MyBuild.ipynb
          - W01_UncertaintyDemo_Team01.ipynb
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt jupyter nbconvert ipykernel

      - name: Execute ${{ matrix.notebook }}
        run: |
          jupyter nbconvert --to notebook --execute "${{ matrix.notebook }}" \
            --output-dir "$RUNNER_TEMP/executed" \
            --ExecutePreprocessor.timeout=600

      - name: Upload the figures produced by the run
        uses: actions/upload-artifact@v4
        with:
          name: figures-${{ matrix.notebook }}
          path: figures/
          if-no-files-found: ignore
